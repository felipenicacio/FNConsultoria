# ============================================================
# OWASP ZAP Baseline — Preview Cloudflare PR #17
# FEL-39 — Security Gate V1
#
# NOTA DE TRIGGER:
# workflow_dispatch requer que o arquivo esteja em main.
# Trigger push restrito à branch da PR para esta validação.
# Após merge em main: somente workflow_dispatch.
#
# Alvo FIXO: preview da PR #17 — NÃO produção.
# Baseline/passive scan — SEM active scan, fuzzing ou DoS.
# fail_action: false — primeiro run para triagem.
# allow_issue_writing: false — sem Issues automáticas.
#
# SHAs verificados via API GitHub em 2026-08-13:
#   zaproxy/action-baseline v0.15.0 → de8ad967d3548d44ef623df22cf95c3b0baf8b25
#   actions/checkout v4.2.2         → 11d5960a326750d5838078e36cf38b85af677262
# ============================================================
name: ZAP Baseline — Preview PR #17

on:
  push:
    branches:
      - 'felipenicacio/fel-39-security-gate-v1'
    paths:
      - '.github/workflows/security-zap-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Job 1: Validação de headers HTTP ──────────────────────
  headers:
    name: Validar headers HTTP do Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checar headers do Preview
        run: |
          set -euo pipefail
          TARGET="https://a1e5d904.fnconsultoria.pages.dev"
          echo "Alvo: $TARGET"
          echo ""
          HEADERS=$(curl -sSI "$TARGET" 2>&1)
          echo "=== Headers brutos ==="
          echo "$HEADERS"
          echo ""
          echo "=== Verificação de security headers ==="
          FAIL=0
          for HEADER in \
            "content-security-policy" \
            "strict-transport-security" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "x-frame-options"; do
            if echo "$HEADERS" | grep -qi "^${HEADER}:"; then
              VALUE=$(echo "$HEADERS" | grep -i "^${HEADER}:" | head -1 | sed 's/^[^:]*: *//')
              echo "  OK  $HEADER: $VALUE"
            else
              echo "  AUSENTE  $HEADER"
              FAIL=1
            fi
          done
          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "FALHA: um ou mais security headers obrigatórios estão ausentes."
            exit 1
          else
            echo "OK: todos os security headers confirmados."
          fi

  # ── Job 2: ZAP Baseline Scan ──────────────────────────────
  zap:
    name: ZAP Baseline Scan — Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: headers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: ZAP Baseline Scan
        # zaproxy/action-baseline v0.15.0 faz upload do artefato internamente
        # com o nome definido em artifact_name — não duplicar upload.
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://a1e5d904.fnconsultoria.pages.dev'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-preview-report'
          cmd_options: '-a'
