# ============================================================
# SCA + npm audit — Trivy + npm audit
# FEL-55 — Security Gate V1
# Gate: CRITICAL/HIGH bloqueiam; MEDIUM triagem; LOW registrar
# ============================================================
name: Dependencies — Trivy + npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 5'  # sexta-feira 04:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy SCA / Misconfigs / Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run Trivy (filesystem)
        # Trivy escaneia: vulnerabilidades em dependências, misconfigurations,
        # e secrets como segunda camada (complementar ao Gitleaks).
        # CRITICAL/HIGH → exit code 1 (bloqueia)
        # --skip-dirs evita ruído em node_modules após instalação
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: '1'
          severity: CRITICAL,HIGH
          skip-dirs: node_modules,dist,.astro
          format: table

      - name: Trivy — relatório completo (MEDIUM/LOW, informativo)
        # Segunda execução sem gate para registrar severidades menores
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: '0'
          severity: MEDIUM,LOW,UNKNOWN
          skip-dirs: node_modules,dist,.astro
          format: table

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit — gate Critical/High
        # Bloqueia em Critical ou High
        run: npm audit --audit-level=high

      - name: npm audit — relatório completo (informativo)
        # Exibe Moderate/Low sem bloquear
        if: always()
        run: npm audit --audit-level=none || true
