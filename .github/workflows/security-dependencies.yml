# ============================================================
# SCA + npm audit — Trivy + npm audit
# FEL-55 — Security Gate V1
# Gate: CRITICAL/HIGH bloqueiam; MEDIUM triagem; LOW registrar
#
# Correção 2026-08-13: trivy-action v0.28.0 referenciava
# setup-trivy@v0.2.1 (inexistente). Atualizado para v0.36.0
# que usa setup-trivy@v0.2.6 (válida).
# SHA verificado via API GitHub em 2026-08-13.
# ============================================================
name: Dependencies — Trivy + npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 5'  # sexta-feira 04:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy SCA / Misconfigs / Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Run Trivy — gate CRITICAL/HIGH
        # trivy-action v0.36.0 — usa setup-trivy@v0.2.6 (corrigido vs v0.2.1 inexistente)
        # SHA do commit que v0.36.0 aponta, verificado via API GitHub
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: '1'
          severity: CRITICAL,HIGH
          skip-dirs: node_modules,dist,.astro
          format: table

      - name: Run Trivy — relatório MEDIUM/LOW (informativo)
        # Segunda execução sem gate para registrar severidades menores
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          exit-code: '0'
          severity: MEDIUM,LOW,UNKNOWN
          skip-dirs: node_modules,dist,.astro
          format: table

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit — gate Critical/High
        run: npm audit --audit-level=high

      - name: npm audit — relatório completo (informativo)
        if: always()
        run: npm audit --audit-level=none || true
