# ============================================================
# Secrets Scanning — Gitleaks
# FEL-55 — Security Gate V1
# Qualquer secret confirmado BLOQUEIA.
# fetch-depth: 0 permite análise do histórico Git completo.
# ============================================================
name: Secrets — Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 2 * * 1'  # segunda-feira 02:43 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # Gitleaks via container oficial — sem necessidade de token externo
        # exit-code 1 em qualquer finding confirmado
        # --redact evita imprimir o valor completo do secret nos logs
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/path" \
            zricethezav/gitleaks:latest \
            detect \
              --source /path \
              --exit-code 1 \
              --redact \
              --log-level info

      # NOTA DE SEGURANÇA:
      # Se este job falhar com um finding REAL de secret:
      # 1. NÃO copiar o valor do secret para nenhum lugar
      # 2. Revogar/rotacionar a credencial IMEDIATAMENTE
      # 3. Avaliar se o histórico Git precisa de limpeza (BFG/git-filter-repo)
      # 4. Só criar allowlist após confirmar falso positivo
