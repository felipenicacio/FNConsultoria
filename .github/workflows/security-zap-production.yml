# ============================================================
# OWASP ZAP Baseline — Produção www.fnsecurity.com.br
# FEL-39 — Security Gate V1
#
# Executar SOMENTE com autorização explícita de Felipe Nicácio.
# Baseline/passive scan — SEM active scan, fuzzing ou DoS.
# fail_action: false — primeiro run para triagem.
# allow_issue_writing: false — sem Issues automáticas.
#
# SHAs verificados via API GitHub em 2026-08-13:
#   zaproxy/action-baseline v0.15.0 → de8ad967d3548d44ef623df22cf95c3b0baf8b25
#   actions/checkout v4.2.2         → 11d5960a326750d5838078e36cf38b85af677262
# ============================================================
name: ZAP Baseline — Produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers-production:
    name: Validar headers HTTP de Produção
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checar headers de produção
        run: |
          set -euo pipefail
          TARGET="https://www.fnsecurity.com.br"
          echo "Alvo: $TARGET"
          HEADERS=$(curl -sSI "$TARGET" 2>&1)
          echo "=== Headers brutos ==="
          echo "$HEADERS"
          echo ""
          echo "=== Verificação de security headers ==="
          FAIL=0
          for HEADER in \
            "content-security-policy" \
            "strict-transport-security" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "x-frame-options"; do
            if echo "$HEADERS" | grep -qi "^${HEADER}:"; then
              VALUE=$(echo "$HEADERS" | grep -i "^${HEADER}:" | head -1 | sed 's/^[^:]*: *//')
              echo "  OK  $HEADER: $VALUE"
            else
              echo "  AUSENTE  $HEADER"
              FAIL=1
            fi
          done
          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "FALHA: um ou mais security headers obrigatórios ausentes em produção."
            exit 1
          else
            echo "OK: todos os security headers confirmados em produção."
          fi

  zap-production:
    name: ZAP Baseline Scan — Produção
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: headers-production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: ZAP Baseline Scan — www.fnsecurity.com.br
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://www.fnsecurity.com.br'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-production-report'
          cmd_options: '-a'
